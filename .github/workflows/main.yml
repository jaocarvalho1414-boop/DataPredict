name: Atualizar banco

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 9h UTC (6h em Brasília)
  workflow_dispatch:       # permite rodar manualmente também

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Atualizar e processar
        run: |
          python -c "from atualizar import atualizar_banco; print(atualizar_banco())"
          python main.py

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dataset/
          git diff --staged --quiet || git commit -m "Atualiza banco de dados"
          git push
